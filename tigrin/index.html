<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐯 Tigrin do Felipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🐯 Tigrin do Felipe</h1>

        <div class="saldo">
            Saldo: <span id="saldo">R$ 100</span>
        </div>

        <div class="slots">
            <div class="slot" id="slot1">?</div>
            <div class="slot" id="slot2">?</div>
        </div>

        <div class="aposta-box">
            <input type="number" id="aposta" placeholder="Valor da aposta">
            <button id="jogar">🎰 Girar</button>
        </div>

        <div class="acoes">
            <button id="depositar">💰 Depositar</button>
            <button id="sacar">🏦 Sacar</button>
        </div>

        <p id="mensagem"></p>
    </div>

    <script src="trigrin.js"></script>
</body>
</html>
